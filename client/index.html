<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RemoteLens" />
    <meta name="theme-color" content="#000000" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>RemoteLens Pro - Zero Loss Remote Camera</title>
  </head>
  <body class="antialiased overflow-x-hidden m-0 p-0">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Immediately forward any client loaded on port 5001 to canonical port 5000
      if (window.location.port === '5001') {
        window.location.replace('https://' + window.location.hostname + ':5000' + window.location.pathname + window.location.search);
      }

      // Clear legacy cache to immediately load fresh black & white styles
      if ('caches' in window) {
        caches.keys().then((keys) => {
          keys.forEach((key) => caches.delete(key));
        });
      }
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          for (let registration of registrations) {
            registration.update();
          }
        });
      }
    </script>
  </body>
</html>
